<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F6E56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nuvia">
<title>Nuvia · Prototipo integral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#F3F3EF; --surface:#FFFFFF; --raise:#FBFAF7;
    --ink:#22201D; --ink2:#655F56; --ink3:#9B958B; --line:#E7E3DC;
    --teal:#0F6E56; --teal-ink:#085041; --tint:#E1F5EE; --tint2:#EFF9F5;
    --paid:#5F5E5A; --committed:#D9922E; --available:#7BAA4E; --over:#C0533F; --estimate:#8FCFB6;
    --warn-tint:#FBEEDA; --warn-ink:#8A5A12; --danger-tint:#FAE9E5; --danger-ink:#8A2F1E; --success-tint:#E8F1DD; --success-ink:#3E6D1E;
    --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--canvas);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-0.01em;}
  .num{font-variant-numeric:tabular-nums;}
  input,select,button{font-family:inherit;font-size:14px;}
  input,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink);}
  input:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:500;cursor:pointer;color:var(--ink);}
  .btn:hover{border-color:var(--ink3);}
  .btn-primary{background:var(--teal);color:#fff;border:none;}
  .btn-primary:hover{background:var(--teal-ink);}
  .btn-sm{padding:5px 10px;font-size:13px;border-radius:8px;}
  .btn-ghost{background:none;border:none;color:var(--teal);cursor:pointer;font-weight:500;padding:6px 8px;}
  .badge{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;display:inline-block;}
  .b-teal{background:var(--tint);color:var(--teal-ink);}
  .b-success{background:var(--success-tint);color:var(--success-ink);}
  .b-warn{background:var(--warn-tint);color:var(--warn-ink);}
  .b-danger{background:var(--danger-tint);color:var(--danger-ink);}
  .b-neutral{background:var(--canvas);color:var(--ink2);border:1px solid var(--line);}

  .topbar{background:var(--teal);color:#fff;padding:12px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:10;}
  .mark{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--teal);display:flex;align-items:center;justify-content:center;font-family:"Bricolage Grotesque";font-weight:700;font-size:18px;}
  .wordmark{font-family:"Bricolage Grotesque";font-weight:700;font-size:20px;letter-spacing:1px;}
  .tabs{display:flex;gap:2px;flex-wrap:wrap;}
  .tab{border:none;background:none;color:rgba(255,255,255,.8);font-size:14px;padding:7px 13px;border-radius:999px;cursor:pointer;}
  .tab:hover{color:#fff;}
  .tab.active{background:rgba(255,255,255,.16);color:#fff;font-weight:500;}
  .topmeta{margin-left:auto;text-align:right;font-size:12.5px;opacity:.92;}

  .wrap{max-width:1120px;margin:0 auto;padding:22px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;}
  .soft{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:16px;}
  .grid{display:grid;gap:14px;}
  .g2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr));}
  .g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr));}
  .g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .sec-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .sec-title h2{font-size:19px;font-weight:600;}
  .muted{color:var(--ink3);}

  .kpi-label{font-size:12px;color:var(--ink3);margin-bottom:4px;}
  .kpi-val{font-family:"Bricolage Grotesque";font-size:23px;font-weight:600;}
  .bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--canvas);}
  .bar span{display:block;height:100%;}
  .legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:10px;}
  .dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:1px;}
  .av{width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--teal-ink);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;margin-left:-6px;border:2px solid var(--surface);}
  .av:first-child{margin-left:0;}
  .ic{width:36px;height:36px;border-radius:9px;background:var(--tint);color:var(--teal-ink);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}

  .rubro-row{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;}
  .rubro-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .rubro-head .nm{font-weight:600;font-size:15px;}
  .ctrl-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;}
  .fld{display:flex;flex-direction:column;gap:3px;}
  .fld label{font-size:11px;color:var(--ink2);}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip-p{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;}
  .chip-p.on{background:var(--teal);color:#fff;border-color:var(--teal);}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:600;padding:6px 8px;}
  td{padding:5px 8px;border-top:1px solid var(--line);}
  td input[type=number]{width:100px;text-align:right;}
  td input[type=date]{width:140px;}
  .row-del{color:var(--ink3);border:none;background:none;cursor:pointer;font-size:17px;padding:2px 6px;}
  .ic-edit{cursor:pointer;position:relative;border:none;}
  .ic-edit:hover{box-shadow:0 0 0 2px var(--teal);}
  .ic-edit .pen{position:absolute;bottom:-4px;right:-4px;background:var(--surface);border:1px solid var(--line);border-radius:50%;width:16px;height:16px;font-size:9px;display:flex;align-items:center;justify-content:center;line-height:1;}
  .name-edit{border:none;border-bottom:1px dashed var(--ink3);background:transparent;font-weight:600;font-size:15px;padding:2px 2px;font-family:inherit;color:var(--ink);min-width:130px;}
  .name-edit:hover{border-bottom-color:var(--teal);}
  .name-edit:focus{outline:none;border-bottom:2px solid var(--teal);}
  .btn-del{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--ink2);display:inline-flex;align-items:center;gap:5px;font-weight:500;}
  .btn-del:hover{background:var(--danger-tint);color:var(--danger-ink);border-color:#E7BDB2;}
  .icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:12px 0;}
  .icon-opt{font-size:20px;padding:7px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;text-align:center;}
  .icon-opt:hover{border-color:var(--teal);background:var(--tint2);}
  .icon-opt.on{border:2px solid var(--teal);background:var(--tint);}
  .plan-amt{color:var(--ink3);background:var(--raise);}
  .plan-amt:focus{color:var(--ink);}
  .row-del:hover{color:var(--over);}
  .hint{font-size:12px;padding:7px 11px;border-radius:8px;margin-top:10px;display:inline-block;}
  .hint-ok{background:var(--tint);color:var(--teal-ink);} .hint-warn{background:var(--warn-tint);color:var(--warn-ink);} .hint-over{background:var(--danger-tint);color:var(--danger-ink);}
  .thumb{width:30px;height:30px;border-radius:6px;object-fit:cover;border:1px solid var(--line);cursor:pointer;vertical-align:middle;}
  .linklike{color:var(--teal);cursor:pointer;font-size:12px;}
  .filechip{display:inline-flex;align-items:center;gap:6px;background:var(--tint2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12px;}

  .contrib{border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-bottom:9px;cursor:pointer;background:var(--surface);}
  .contrib:hover{border-color:var(--ink3);} .contrib.sel{border:2px solid var(--teal);padding:11px 12px;}
  .contrib .sub{font-size:12px;color:var(--ink2);margin-top:4px;display:flex;justify-content:space-between;}
  .genrow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;background:var(--tint2);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:14px;}
  .genrow input{width:96px;}

  .cal-month h4{font-size:13px;color:var(--ink2);text-transform:capitalize;margin:10px 0 6px;font-family:"Figtree";font-weight:600;}
  .cal-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;}
  .cal-item .amt{margin-left:auto;font-weight:600;}
  .flow{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px;overflow-x:auto;}
  .flow .col{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:40px;flex:1;}
  .flow .barv{width:24px;background:var(--teal);border-radius:5px 5px 0 0;}
  .flow .mlab{font-size:9.5px;color:var(--ink3);text-align:center;} .flow .vlab{font-size:9.5px;color:var(--ink2);}

  .opt{display:flex;align-items:center;gap:11px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer;}
  .opt.on{border:2px solid var(--teal);padding:10px 12px;}
  .rad{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink3);flex-shrink:0;box-sizing:border-box;}
  .opt.on .rad{border:5px solid var(--teal);}
  .chip{font-size:13px;background:var(--surface);border:1px solid var(--line);padding:7px 13px;border-radius:999px;cursor:pointer;}
  .chip:hover{border-color:var(--teal);color:var(--teal-ink);}
  .footer{max-width:1120px;margin:0 auto;padding:14px 22px 44px;color:var(--ink3);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;}
  .footer .acts{display:flex;gap:8px;flex-wrap:wrap;}

  #modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center;padding:20px;}
  #modalCard{max-width:420px;width:100%;max-height:90vh;overflow:auto;}
  #banner{display:none;position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--warn-tint);color:var(--warn-ink);border:1px solid #E7C98A;padding:10px 14px;border-radius:10px;font-size:13px;z-index:90;box-shadow:0 6px 20px rgba(0,0,0,.12);}
</style>
</head>
<body>

<div class="topbar">
  <span class="mark">N</span><span class="wordmark">NUVIA</span>
  <div class="tabs" id="tabs">
    <button class="tab active" data-act="nav" data-view="inicio">Inicio</button>
    <button class="tab" data-act="nav" data-view="rubros">Rubros</button>
    <button class="tab" data-act="nav" data-view="aportes">Aportes</button>
    <button class="tab" data-act="nav" data-view="proveedores">Proveedores</button>
    <button class="tab" data-act="nav" data-view="dashboard">Dashboard</button>
    <button class="tab" data-act="nav" data-view="copiloto">Copiloto</button>
    <button class="tab" data-act="nav" data-view="home">NUVIA Home</button>
  </div>
  <div class="topmeta"><div id="wtitle" style="font-weight:600"></div><div id="wcount"></div></div>
</div>

<main class="wrap" id="view"></main>
<div class="footer">
  <span>Prototipo local · cambios guardados solo en <strong>este navegador</strong> (no en Supabase, no se comparte).</span>
  <div class="acts">
    <button class="btn btn-sm" data-act="export">⤓ Exportar datos</button>
    <button class="btn btn-sm" data-act="import">⤒ Importar datos</button>
    <button class="btn-ghost" data-act="reset">Reiniciar</button>
  </div>
</div>

<div id="modal"><div class="card" id="modalCard"></div></div>
<div id="banner">Guardado local lleno (archivos grandes). <button class="btn-ghost" data-act="export" style="padding:0 4px">Exportar respaldo</button></div>

<script>
(function(){
  "use strict";
  var KEY="nuvia_full_v1";
  var WEDDING={name:"Luis Pablo & Daniela", date:"2027-07-03", meta:395000};
  var CATICON={venue:"🏛️",planning:"📋",musica:"🎵",foto:"📷",video:"🎬",deco:"🎨",licor:"🍷",pastel:"🎂",argollas:"💍"};
  var PLAN_LABELS={cuotas_iguales:"Cuotas iguales",anticipo_iguales:"Anticipo + cuotas iguales",pago_unico:"Pago único",fuerte_suave:"Fuerte al inicio, suave al final",suave_fuerte:"Suave al inicio, fuerte al final",personalizado:"Personalizado",cuota_fija:"Cuotas iguales",anticipo_cuota:"Anticipo + cuotas iguales"};

  function uid(){return Math.random().toString(36).slice(2,9);}
  function fmtQ(n){return "Q"+Math.round(n||0).toLocaleString("en-US");}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function addMonths(iso,k){var d=new Date(iso+"T00:00:00");d.setMonth(d.getMonth()+k);return d.toISOString().slice(0,10);}
  function monthKey(iso){return iso.slice(0,7);}
  function monthName(key){var m=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];var p=key.split("-");return m[+p[1]-1]+" "+p[0];}
  function shortDate(iso){var m=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];var p=iso.split("-");return +p[2]+" "+m[+p[1]-1];}
  function initials(name){return name.split(" ").slice(0,2).map(function(w){return w[0];}).join("").toUpperCase();}

  // ---------- archivos ----------
  function pickFile(accept,cb){var inp=document.createElement("input");inp.type="file";inp.accept=accept;inp.style.display="none";document.body.appendChild(inp);inp.addEventListener("change",function(){if(inp.files&&inp.files[0])cb(inp.files[0]);document.body.removeChild(inp);});inp.click();}
  function makeThumbnail(file,maxDim,cb){var fr=new FileReader();fr.onload=function(){var img=new Image();img.onload=function(){var cap=Math.min(maxDim||500,500);var s=Math.min(1,cap/Math.max(img.width,img.height));var cw=Math.round(img.width*s),ch=Math.round(img.height*s);var c=document.createElement("canvas");c.width=cw;c.height=ch;c.getContext("2d").drawImage(img,0,0,cw,ch);cb(c.toDataURL("image/jpeg",0.5));};img.src=fr.result;};fr.readAsDataURL(file);}
  function readDataURL(file,cb){var fr=new FileReader();fr.onload=function(){cb(fr.result);};fr.readAsDataURL(file);}
  function readText(file,cb){var fr=new FileReader();fr.onload=function(){cb(fr.result);};fr.readAsText(file);}
  function openDataUrl(url){try{fetch(url).then(function(r){return r.blob();}).then(function(b){window.open(URL.createObjectURL(b),"_blank");});}catch(e){window.open(url,"_blank");}}

  // ---------- datos reales ----------
  function seed(){
    var people=[{id:"lp",name:"Luis Pablo"},{id:"dani",name:"Daniela"},{id:"paola",name:"Paola"},{id:"julia",name:"Julia"},{id:"luis",name:"Luis"},{id:"danilo",name:"Danilo"}];
    var pools=[{id:"boda",label:"Boda"},{id:"plp",label:"Personal LP"},{id:"pdani",label:"Personal Dani"},{id:"comp",label:"Compartida LP+Dani"},{id:"reserva",label:"Reserva"},{id:"eng",label:"Enganche casa (meta)"}];
    function ins(list){return list.map(function(x){return {id:uid(),date:x[0],planned:x[1],paidAmount:0,paid:false,boleta:null,account:null};});}
    var contributors=[
      {id:uid(),name:"Paola",ceiling:100000,plan:"suave_fuerte",confidence:"firme",installments:ins([["2026-09-05",6000],["2026-10-05",6000],["2026-11-05",6000],["2026-12-05",6000],["2027-01-05",6000],["2027-02-05",6000],["2027-03-05",16000],["2027-04-05",16000],["2027-05-05",16000],["2027-06-05",16000]])},
      {id:uid(),name:"Julia",ceiling:65000,plan:"cuota_fija",confidence:"firme",installments:[]},
      {id:uid(),name:"Luis",ceiling:65000,plan:"cuota_fija",confidence:"firme",installments:[]},
      {id:uid(),name:"Luis Pablo",ceiling:55000,plan:"anticipo_cuota",confidence:"firme",installments:[]},
      {id:uid(),name:"Daniela",ceiling:10000,plan:"cuota_fija",confidence:"firme",installments:[]},
      {id:uid(),name:"Danilo (suegro)",ceiling:0,plan:"personalizado",confidence:"incierto",installments:[]}
    ];
    var guestMap={"Paola":80,"Julia":50,"Luis":50,"Luis Pablo":40,"Daniela":20,"Danilo (suegro)":10};
    contributors.forEach(function(c){c.guests=guestMap[c.name]||0;});
    function cid(nm){var c=contributors.filter(function(x){return x.name===nm;})[0];return c?c.id:null;}
    function sp(){return {base:"porcentaje",funders:[]};}
    function ven(name,cur,amt,fav,note){return {id:uid(),name:name,currency:cur,amount:amt,fav:!!fav,note:note||"",proposal:null,selected:false};}
    function rub(name,cat,pool,techo,pagado,ass,vendors,selName){
      var r={id:uid(),name:name,cat:cat,poolId:pool,techo:techo,pagado:pagado,assignees:ass,split:sp(),vendors:vendors||[],selectedVendorId:null,status:"por_definir",vendor:null,comprometido:0};
      if(selName){var v=r.vendors.filter(function(x){return x.name===selName;})[0];if(v){v.selected=true;r.selectedVendorId=v.id;r.vendor=v.name;r.status="contratado";}}
      else if(r.vendors.length){r.status="evaluacion";}
      return r;
    }
    var rubros=[
      rub("Venue + banquete","venue","boda",130000,5000,["lp","dani"],[ven("Hacienda Nueva","GTQ",129000,true,"250 pax garantía")],"Hacienda Nueva"),
      rub("Planning","planning","boda",32000,16000,["dani"],[ven("Muckay Ixcamparij","GTQ",32000,true,"")],"Muckay Ixcamparij"),
      rub("Música","musica","boda",35000,0,["lp"],[ven("Mr. Music","GTQ",34944,true,"IVA incluido")],"Mr. Music"),
      rub("Fotografía","foto","boda",30000,0,["lp","dani"],[ven("Juanfer Penagos","USD",3650,true,"8h · sin IVA, sube al facturar"),ven("Daniel López Pérez","USD",5400,false,"8h · equipo 2 · Vogue/NYT")]),
      rub("Video","video","boda",27000,0,["lp"],[ven("Juanfer Penagos","USD",3400,true,"8h")]),
      rub("Decoración","deco","boda",14000,0,["dani"],[]),
      rub("Licor","licor","boda",12000,0,["lp"],[]),
      rub("Pastel","pastel","boda",6000,0,["dani"],[]),
      rub("Argollas","argollas","comp",8000,0,["lp","dani"],[])
    ];
    // reparto de ejemplo en Venue
    rubros[0].split={base:"porcentaje",funders:[{cid:cid("Paola"),pct:65,fixed:0},{cid:cid("Julia"),pct:30,fixed:0},{cid:cid("Daniela"),pct:5,fixed:0}]};
    // fijar comprometido de los contratados = suma de proveedores seleccionados
    rubros.forEach(function(r){recomputeRubro(r);});
    rubros[1].pagado=16000;
    var aportes=[{id:uid(),name:"Despedida de solteros",date:"2027-05-15",amount:8000,poolId:"boda"},{id:uid(),name:"Regalos de la recepción",date:"2027-07-10",amount:5000,poolId:"boda"}];
    return {fx:7.95,people:people,pools:pools,rubros:rubros,contributors:contributors,aportes:aportes};
  }

  var state, view="inicio", selContrib=null, pending=null, storageFull=false, selVendor=null, chartPool="boda", insFilter="";
  function load(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}return null;}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageFull=false;}catch(e){storageFull=true;}var b=document.getElementById("banner");if(b)b.style.display=storageFull?"block":"none";}
  state=load()||seed();
  if(!state.teas)state.teas=[];
  if(!state.gifts)state.gifts=[];
  if(!state.aportes){state.aportes=[];(state.teas||[]).forEach(function(t){state.aportes.push({id:t.id||uid(),name:t.name||"Aporte",date:t.date||"",amount:+t.amount||0,poolId:"boda"});});(state.gifts||[]).forEach(function(g){state.aportes.push({id:g.id||uid(),name:g.from||"Regalo en efectivo",date:g.date||"",amount:+g.amount||0,poolId:"boda"});});}
  if(!state.decisions)state.decisions=[];
  state.pools.forEach(function(p){if(!p.goals)p.goals=[];});
  if(!state.fx)state.fx=7.95;
  state.rubros.forEach(function(r){

    if(!anySelected && r.selectedVendorId){var sv=r.vendors.filter(function(v){return v.id===r.selectedVendorId;})[0];if(sv)sv.selected=true;}
    recomputeRubro(r);
  });
  state.contributors.forEach(function(c){if(c.guests===undefined)c.guests=0;c.installments.forEach(function(i){if(i.planned===undefined)i.planned=i.amount||0;if(i.paidAmount===undefined)i.paidAmount=i.paid?(i.amount||0):0;if(i.paid===undefined)i.paid=i.paidAmount>0;if(i.account===undefined)i.account=null;});});

  // precio de un proveedor SIEMPRE en quetzales (convierte USD con el tipo de cambio)
  function vendorQ(v){return v?(v.currency==="USD"?Math.round((v.amount||0)*(state.fx||7.95)):(v.amount||0)):0;}

  function personName(id){var p=state.people.filter(function(x){return x.id===id;})[0];return p?p.name:id;}

  function fundingTotals(){var pledges=0,enPlan=0,pagado=0;state.contributors.forEach(function(c){pledges+=(c.ceiling||0);c.installments.forEach(function(i){enPlan+=(i.planned!=null?i.planned:i.amount)||0;if(i.paid)pagado+=(i.paidAmount!=null?i.paidAmount:i.amount)||0;});});var ap=state.aportes||[];var aportesBoda=ap.filter(function(a){return a.poolId==="boda";}).reduce(function(s,a){return s+(+a.amount||0);},0);var aportesOtros=ap.filter(function(a){return a.poolId!=="boda";}).reduce(function(s,a){return s+(+a.amount||0);},0);var prometido=pledges+aportesBoda;return {pledges:pledges,aportesBoda:aportesBoda,aportesOtros:aportesOtros,prometido:prometido,enPlan:enPlan,pagado:pagado,brecha:Math.max(0,WEDDING.meta-prometido)};}
  // ----- reparto (mecánica tipo Splitwise) -----
  function contribById(id){return state.contributors.filter(function(x){return x.id===id;})[0];}
  function pctSum(r){return r.split.funders.reduce(function(a,f){return a+(+f.pct||0);},0);}
  // base de costo del rubro: si ya hay proveedor oficial, el costo real; si no, el techo (estimado)
  function rubroCostBase(r){return (r.status==="contratado"&&r.comprometido>0)?r.comprometido:(r.techo||0);}
  function computeShares(r){
    var T=rubroCostBase(r), f=r.split.funders, n=f.length, base=r.split.base; if(!n)return [];
    var raw;
    if(base==="fijo"){raw=f.map(function(x){return +x.fixed||0;});}
    else if(base==="iguales"){raw=f.map(function(){return T/n;});}
    else if(base==="capacidad"){var caps=f.map(function(x){var c=contribById(x.cid);return c?Math.max(0,c.ceiling||0):0;});var sc=caps.reduce(function(a,b){return a+b;},0);raw=caps.map(function(cp){return sc>0?T*cp/sc:T/n;});}
    else {raw=f.map(function(x){return T*(+x.pct||0)/100;});}
    var amounts=raw.map(function(v){return Math.round(v/50)*50;});
    var mustCover=base==="iguales"||base==="capacidad"||(base==="porcentaje"&&pctSum(r)===100);
    if(mustCover&&amounts.length){var sum=amounts.reduce(function(a,b){return a+b;},0);var idx=amounts.indexOf(Math.max.apply(null,amounts));amounts[idx]+=(T-sum);if(amounts[idx]<0)amounts[idx]=0;}
    return f.map(function(x,i){return {cid:x.cid,amount:amounts[i]};});
  }
  function assignedMap(){var m={};state.rubros.forEach(function(r){computeShares(r).forEach(function(s){m[s.cid]=(m[s.cid]||0)+s.amount;});});return m;}
  // desglose: por cada rubro donde el aportante financia, cuánto le toca y con qué proveedor

  // pagado por cuenta (rubro) para un aportante: suma de cuotas pagadas dirigidas a ese rubro
  function paidByRubro(c){var m={};c.installments.forEach(function(i){if((+i.paidAmount>0)&&i.account)m[i.account]=(m[i.account]||0)+(+i.paidAmount||0);});return m;}
  function installmentPool(i){return i.account?(rubro(i.account)?rubro(i.account).poolId:"boda"):"boda";}

  function avatars(ids){return (ids||[]).map(function(id){return '<span class="av" title="'+esc(personName(id))+'">'+initials(personName(id))+'</span>';}).join("");}
  function generate(total,n,start,shape){
    if(!total||!start)return [];
    if(shape==="pago_unico")n=1;
    if(!n||n<1)return [];
    var w=[];for(var i=0;i<n;i++){var half=n/2;var wt=1;
      if(shape==="cuotas_iguales"||shape==="cuota_fija")wt=1;
      else if(shape==="suave_fuerte")wt=(i<half)?1:2;
      else if(shape==="fuerte_suave")wt=(i<half)?2:1;
      else if(shape==="anticipo_iguales"||shape==="anticipo_cuota")wt=(i===0?Math.max(1,(n-1)*1.6):1);
      else wt=1;
      w.push(wt);}
    var sw=w.reduce(function(a,b){return a+b;},0),out=[],acc=0;
    for(var j=0;j<n;j++){var amt=Math.round((total*w[j]/sw)/50)*50;out.push({id:uid(),date:addMonths(start,j),planned:amt,paidAmount:0,paid:false,boleta:null,account:null});acc+=amt;}
    if(out.length)out[out.length-1].planned+=(total-acc);
    return out;
  }

    var meta=poolId==="boda"?WEDDING.meta:0;
    var ymax=Math.max(ap,ar,meta,1);ymax=Math.ceil(ymax/5000)*5000;

    function poly(arr){return arr.map(function(v,idx){return X(idx).toFixed(1)+","+Y(v).toFixed(1);}).join(" ");}
    var planLine='<polyline points="'+poly(cumPlan)+'" fill="none" stroke="var(--ink3)" stroke-width="2.5"/>';
    var realLine='<polyline points="'+poly(cumReal)+'" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-dasharray="6 4"/>';
    var dots="";cumReal.forEach(function(v,idx){dots+='<circle cx="'+X(idx).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3" fill="var(--teal)"/>';});

  function vDashboard(){
    var bt=budgetTotals(), ft=fundingTotals();
    // selector de evento (hoy Boda; diseñado para múltiples eventos a futuro)
    var eventBar=eventBarHTML();
    var kpis=[["Techo oficial",fmtQ(bt.techo)],["Comprometido",fmtQ(bt.comp)],["Disponible",fmtQ(bt.disp)],["Brecha de fondeo",fmtQ(ft.brecha)]].map(function(x,idx){return '<div class="soft"><div class="kpi-label">'+x[0]+'</div><div class="kpi-val num"'+(idx===3&&ft.brecha>0?' style="color:var(--warn-ink)"':'')+'>'+x[1]+'</div></div>';}).join("");

    // ---- OVERLOOK: invitados, meta, total de la boda, costo por invitado, costo justo ----
    var totalBoda=bt.techo;                 // suma de rubros (crece al elegir proveedores)
    var meta=WEDDING.meta;                  // meta de fondeo
    var totalGuests=state.contributors.reduce(function(s,c){return s+(+c.guests||0);},0);
    var perGuest=totalGuests>0?meta/totalGuests:0;   // por ahora, sobre la META de fondeo
    var ovKpis=[["Meta de fondeo",fmtQ(meta),"objetivo de recaudación"],["Total de la boda",fmtQ(totalBoda),"suma de rubros · en progreso"],["Invitados",totalGuests.toLocaleString("en-US"),"suma por aportante"],["Costo por invitado",fmtQ(perGuest),"sobre la meta de fondeo"]].map(function(x){return '<div class="soft"><div class="kpi-label">'+x[0]+'</div><div class="kpi-val num">'+x[1]+'</div><div style="font-size:11px;color:var(--ink3)">'+x[2]+'</div></div>';}).join("");
    var ovRows=state.contributors.map(function(c){
      var g=+c.guests||0, justo=Math.round(g*perGuest), prom=c.ceiling||0, diff=prom-justo;
      var diffTxt=prom===0?'<span class="muted">—</span>':diff>=0?'<span style="color:var(--success-ink)">cubre +'+fmtQ(diff)+'</span>':'<span style="color:var(--over)">falta '+fmtQ(-diff)+'</span>';
      return '<tr><td style="font-weight:600">'+esc(c.name)+'</td>'+
        '<td style="text-align:center"><input type="number" min="0" data-act="guests" data-id="'+c.id+'" value="'+g+'" style="width:70px;text-align:center"></td>'+
        '<td style="text-align:right" class="num">'+fmtQ(justo)+'</td>'+
        '<td style="text-align:right" class="num">'+(prom?fmtQ(prom):"—")+'</td>'+
        '<td style="text-align:right;font-size:13px">'+diffTxt+'</td></tr>';
    }).join("");
    var overlook='<div class="card" style="margin-bottom:16px"><div class="sec-title"><h2>Overlook de la boda</h2><span class="muted" style="font-size:12px">Costo por invitado y aporte "justo" por persona</span></div>'+
      '<div class="grid g4" style="margin-bottom:14px">'+ovKpis+'</div>'+
      '<table><thead><tr><th>Aportante</th><th style="text-align:center">Invitados</th><th style="text-align:right">Costo justo</th><th style="text-align:right">Prometió</th><th style="text-align:right">Balance</th></tr></thead><tbody>'+ovRows+'</tbody></table>'+
      '<p class="muted" style="font-size:12px;margin-top:10px">El <strong>costo por invitado</strong> se calcula hoy sobre la <strong>meta de fondeo</strong> (Q'+meta.toLocaleString("en-US")+'); cuando todos los proveedores estén elegidos, el <strong>total de la boda</strong> será la suma real de los rubros. El <strong>costo justo</strong> = invitados × costo por invitado; el <strong>balance</strong> lo compara con lo prometido.</p></div>';

    var bars=state.rubros.map(function(r){var over=r.comprometido>r.techo, ev=r.status==="evaluacion";var seg=ev?'<span style="width:78%;background:var(--estimate)"></span>':'<span style="width:'+(r.pagado/Math.max(r.techo,1)*100)+'%;background:var(--paid)"></span><span style="width:'+(Math.max(0,r.comprometido-r.pagado)/Math.max(r.techo,1)*100)+'%;background:'+(over?"var(--over)":"var(--committed)")+'"></span>';return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span style="width:130px;font-size:13px">'+esc(r.name)+'</span><div class="bar" style="flex:1">'+seg+'</div><span style="width:66px;text-align:right;font-size:12px;color:'+(over?"var(--over)":"var(--ink2)")+'" class="num">'+(ev?"en eval.":fmtQ(r.techo))+'</span></div>';}).join("");
    var decisions=[];state.rubros.forEach(function(r){if(r.status==="evaluacion")decisions.push(["📷","Elegir proveedor de "+r.name,"Decisión","b-teal"]);if(r.comprometido>r.techo)decisions.push(["▲",r.name+" excede el techo","Sobrecosto","b-danger"]);});if(ft.brecha>0)decisions.push(["🚩","Cerrar brecha de fondeo de "+fmtQ(ft.brecha),"Fondeo","b-warn"]);
    var autoHTML=decisions.map(function(d){return '<div class="cal-item"><span style="width:20px">'+d[0]+'</span><span style="flex:1">'+esc(d[1])+'</span><span class="badge '+d[3]+'">'+d[2]+'</span></div>';}).join("");
    var BADGE={Decisión:"b-teal",Fondeo:"b-warn",Pendiente:"b-neutral"};
    var manHTML=(state.decisions||[]).map(function(d){
      var tagOpts=["Decisión","Fondeo","Pendiente"].map(function(t){return '<option'+(d.tag===t?" selected":"")+'>'+t+'</option>';}).join("");
      return '<div class="cal-item"><span style="width:20px">📌</span><input data-act="dec-text" data-id="'+d.id+'" value="'+esc(d.text)+'" style="flex:1;border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:6px" onfocus="this.style.borderColor=\'var(--line)\'" onblur="this.style.borderColor=\'transparent\'"><select data-act="dec-tag" data-id="'+d.id+'" style="font-size:12px">'+tagOpts+'</select><button class="row-del" data-act="dec-del" data-id="'+d.id+'" title="Borrar">×</button></div>';
    }).join("");
    var decHTML=(autoHTML+manHTML)||'<p class="muted">Sin decisiones pendientes.</p>';
    // resumen de metas por bolsa (definidas en Aportes)
    var allGoals=[];state.pools.forEach(function(p){(p.goals||[]).forEach(function(g){allGoals.push({pool:p.label,poolId:p.id,date:g.date,amount:g.amount});});});
    allGoals.sort(function(a,b){return (a.date||"")<(b.date||"")?-1:1;});
    var goalsSummary="";
    if(allGoals.length){
      goalsSummary='<div class="card" style="margin-bottom:16px"><div class="sec-title"><h2>Metas de fondeo</h2><span class="muted" style="font-size:12px">Definidas por bolsa en Aportes</span></div>'+allGoals.map(function(g){
        var cum=cumPaidUpTo(g.poolId,g.date);
        var done=cum>=g.amount;var pct=Math.min(100,Math.round(cum/Math.max(g.amount,1)*100));
        return '<div style="padding:8px 0;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span><strong>'+esc(g.pool)+'</strong> · '+monthName(monthKey(g.date))+'</span><span class="num">'+(done?'<span style="color:var(--success-ink)">✓ ':'')+fmtQ(cum)+' / '+fmtQ(g.amount)+(done?'</span>':'')+'</span></div><div class="bar"><span style="width:'+pct+'%;background:'+(done?"var(--paid)":"var(--committed)")+'"></span></div></div>';
      }).join("")+'</div>';
    }
    return eventBar+'<div class="grid g4" style="margin-bottom:16px">'+kpis+'</div>'+overlook+goalsSummary+'<div class="card" style="margin-bottom:16px"><div class="sec-title"><h2>Presupuesto por rubro</h2><span class="muted" style="font-size:12px">Pagado · Comprometido · Disponible</span></div>'+bars+'<div class="legend"><span><span class="dot" style="background:var(--paid)"></span>Pagado</span><span><span class="dot" style="background:var(--committed)"></span>Comprometido</span><span><span class="dot" style="background:var(--estimate)"></span>En evaluación</span></div></div><div class="card"><div class="sec-title"><h2>Decisiones pendientes</h2><button class="btn btn-sm" data-act="add-decision">+ Agregar decisión</button></div>'+decHTML+'</div>';
  }

  // ---------- flujos de archivo ----------
  function attachBoleta(iid){pickFile("image/*",function(file){makeThumbnail(file,600,function(thumb){var c=contrib();if(!c)return;var ins=c.installments.filter(function(x){return x.id===iid;})[0];if(!ins)return;pending={iid:iid,thumb:thumb,name:file.name};var det=sharesByContributor(c.id);var acctOpts='<option value="">— elige la cuenta —</option>'+det.map(function(d){return '<option value="'+d.rubroId+'"'+(ins.account===d.rubroId?" selected":"")+'>'+esc(d.name)+(d.vendor?" · "+esc(d.vendor):"")+'</option>';}).join("");openModal('<h3 style="font-size:18px;margin-bottom:6px">Confirmar abono</h3><p class="muted" style="font-size:13px;margin-bottom:12px">Boleta: '+esc(file.name)+'. Elige a qué cuenta va, revisa el monto y confirma.</p><img src="'+thumb+'" style="max-width:100%;max-height:180px;border-radius:8px;border:1px solid var(--line);margin-bottom:12px"><div class="fld" style="margin-bottom:10px"><label>Cuenta (proveedor)</label><select id="bAccount" style="width:100%">'+acctOpts+'</select></div><div class="fld" style="margin-bottom:6px"><label>Monto del abono (Q)</label><input type="number" id="bMonto" value="'+(+ins.paidAmount>0?ins.paidAmount:(+ins.planned||0))+'" style="width:160px"></div><div style="font-size:11px;color:var(--ink3);margin-bottom:14px">En la app real, la IA leería el monto de la boleta y tú solo confirmarías.</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="modal-close">Cancelar</button><button class="btn btn-primary" data-act="confirm-boleta">Confirmar abono</button></div>');});});}
  function confirmBoleta(){if(!pending)return;var c=contrib();if(!c){closeModal();return;}var ins=c.installments.filter(function(x){return x.id===pending.iid;})[0];if(ins){var m=parseFloat(document.getElementById("bMonto").value);if(!isNaN(m))ins.paidAmount=m;var acc=document.getElementById("bAccount");if(acc)ins.account=acc.value||ins.account||null;ins.paid=true;ins.boleta={thumb:pending.thumb,name:pending.name};}closeModal();render();}
  function attachProposal(rid){pickFile("application/pdf",function(file){readDataURL(file,function(url){var r=rubro(rid);if(r){r.proposal={name:file.name,size:file.size,url:url,at:new Date().toISOString().slice(0,10)};render();if(storageFull)alert("La propuesta se adjuntó, pero es muy grande para el guardado automático del navegador. Usa 'Exportar datos' para respaldarla.");}});});}
  function uploadVendorProposal(rid,vid){pickFile("application/pdf",function(file){var r=rubro(rid);var v=r?vendorById(r,vid):null;if(v){v.proposal={name:file.name,size:file.size,url:null,stored:false,at:new Date().toISOString().slice(0,10)};render();openModal(vendorExpedienteHTML(rid,vid));}});}

  function exportData(){try{var blob=new Blob([JSON.stringify(state)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="nuvia-datos-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();document.body.removeChild(a);}catch(e){alert("No se pudo exportar.");}}
  function importData(){pickFile("application/json,.json",function(file){readText(file,function(txt){try{var s=JSON.parse(txt);if(!s.rubros||!s.contributors)throw 0;if(confirm("¿Reemplazar los datos actuales por los del archivo? (Considera exportar antes.)")){state=s;selContrib=state.contributors[0]?state.contributors[0].id:null;render();}}catch(e){alert("Ese archivo no es un respaldo válido de Nuvia.");}});});}

  // ---------- eventos ----------
  var root=document.body;
  root.addEventListener("click",function(e){
    var t=e.target.closest("[data-act]");if(!t)return;var a=t.dataset.act;
    if(a==="nav"){view=t.dataset.view;render();return;}
    if(a==="reset"){if(confirm("¿Volver a los datos de ejemplo? Se perderá lo que hayas cambiado.")){state=seed();selContrib=state.contributors[0].id;render();}return;}
    if(a==="export"){exportData();return;}
    if(a==="import"){importData();return;}
    if(a==="open-rubro"){view="proveedores";render();return;}
    if(a==="add-pool"){state.pools.push({id:uid(),label:"Nueva bolsa",goals:[]});render();return;}
    if(a==="add-decision"){state.decisions.push({id:uid(),text:"Nueva decisión",tag:"Pendiente"});render();return;}
    if(a==="dec-del"){state.decisions=state.decisions.filter(function(x){return x.id!==t.dataset.id;});render();return;}
    if(a==="add-goal"){var pg2=state.pools.filter(function(x){return x.id===chartPool;})[0];if(pg2){if(!pg2.goals)pg2.goals=[];pg2.goals.push({id:uid(),date:"",amount:0});render();}return;}
    if(a==="goal-del"){state.pools.forEach(function(p){if(p.goals)p.goals=p.goals.filter(function(x){return x.id!==t.dataset.id;});});render();return;}
    if(a==="del-pool"){var pl=state.pools.filter(function(x){return x.id===t.dataset.id;})[0];if(!pl)return;var used=state.rubros.filter(function(r){return r.poolId===t.dataset.id;}).length;if(used>0){alert("La bolsa \""+pl.label+"\" tiene "+used+" rubro(s). Muévelos a otra bolsa (desde Rubros) o elimínalos antes de borrarla.");return;}if(confirm("¿Eliminar la bolsa \""+pl.label+"\"?")){state.pools=state.pools.filter(function(x){return x.id!==t.dataset.id;});render();}return;}
    if(a==="assignee"){var r=rubro(t.dataset.id);var pid=t.dataset.person;var k=r.assignees.indexOf(pid);if(k>-1)r.assignees.splice(k,1);else r.assignees.push(pid);render();return;}
    if(a==="add-rubro"){state.rubros.push({id:uid(),name:"Nuevo rubro",cat:"deco",poolId:"boda",techo:0,vendor:null,status:"por_definir",comprometido:0,pagado:0,assignees:[],proposal:null,split:{base:"porcentaje",funders:[]}});render();return;}
    if(a==="del-rubro"){var rd=rubro(t.dataset.id);if(rd&&confirm("¿Eliminar el rubro \""+rd.name+"\"?")){state.rubros=state.rubros.filter(function(x){return x.id!==t.dataset.id;});render();}return;}
    if(a==="pick-icon"){var rp=rubro(t.dataset.id);if(rp){var cur=rp.icon||"";var grid=ICON_CHOICES.map(function(ic){return '<button class="icon-opt'+(ic===cur?" on":"")+'" data-act="set-icon" data-id="'+rp.id+'" data-icon="'+ic+'">'+ic+'</button>';}).join("");openModal('<h3 style="font-size:18px;margin-bottom:4px">Ícono de '+esc(rp.name)+'</h3><p class="muted" style="font-size:13px;margin-bottom:6px">Elige uno o deja que Nuvia lo elija según el nombre.</p><div class="icon-grid">'+grid+'</div><div style="display:flex;justify-content:space-between;align-items:center"><button class="btn btn-sm" data-act="auto-icon" data-id="'+rp.id+'">✨ Automático según el nombre</button><button class="btn btn-sm" data-act="modal-close">Cerrar</button></div>');}return;}
    if(a==="set-icon"){var rs=rubro(t.dataset.id);if(rs){rs.icon=t.dataset.icon;closeModal();render();}return;}
    if(a==="auto-icon"){var ra=rubro(t.dataset.id);if(ra){delete ra.icon;closeModal();render();}return;}
    if(a==="funder-toggle"){var rf=rubro(t.dataset.id);var cd=t.dataset.cid;var ix=rf.split.funders.map(function(f){return f.cid;}).indexOf(cd);if(ix>-1)rf.split.funders.splice(ix,1);else rf.split.funders.push({cid:cd,pct:0,fixed:0});render();return;}
    if(a==="normalizar"){var rn=rubro(t.dataset.id);var fs=rn.split.funders;var s=fs.reduce(function(x,f){return x+(+f.pct||0);},0);if(s>0)fs.forEach(function(f){f.pct=Math.round((+f.pct||0)/s*100);});else fs.forEach(function(f){f.pct=Math.round(100/fs.length);});var d=100-fs.reduce(function(x,f){return x+f.pct;},0);if(fs.length)fs[0].pct+=d;render();return;}
    if(a==="add-aporte"){state.aportes.push({id:uid(),name:"Nuevo aporte",date:"",amount:0,poolId:"boda"});render();return;}
    if(a==="del-aporte"){state.aportes=state.aportes.filter(function(x){return x.id!==t.dataset.id;});render();return;}
    if(a==="sel-contrib"){selContrib=t.dataset.id;insFilter="";render();return;}
    if(a==="add-contrib"){var c={id:uid(),name:"Nuevo aportante",ceiling:0,plan:"personalizado",confidence:"firme",installments:[]};state.contributors.push(c);selContrib=c.id;render();return;}
    if(a==="del-contrib"){var cc=contrib();if(cc&&confirm("¿Eliminar a "+cc.name+"?")){state.contributors=state.contributors.filter(function(x){return x.id!==selContrib;});selContrib=state.contributors[0]?state.contributors[0].id:null;render();}return;}
    if(a==="del-contrib-card"){var cid5=t.dataset.id;var c5=state.contributors.filter(function(x){return x.id===cid5;})[0];if(c5&&confirm("¿Eliminar a "+c5.name+"? También se quitará de los repartos.")){state.contributors=state.contributors.filter(function(x){return x.id!==cid5;});state.rubros.forEach(function(r){if(r.split&&r.split.funders)r.split.funders=r.split.funders.filter(function(f){return f.cid!==cid5;});});if(selContrib===cid5)selContrib=state.contributors[0]?state.contributors[0].id:null;render();}return;}
    if(a==="add-ins"){var c2=contrib();if(c2){var last=c2.installments[c2.installments.length-1];c2.installments.push({id:uid(),date:last&&last.date?addMonths(last.date,1):"2026-09-05",planned:0,paidAmount:0,paid:false,boleta:null,account:null});render();}return;}
    if(a==="ins-del"){var c3=contrib();if(c3){c3.installments=c3.installments.filter(function(x){return x.id!==t.dataset.iid;});render();}return;}
    if(a==="gen-plan"){var c4=contrib();if(c4){var total=+document.getElementById("gTotal").value||0,n=+document.getElementById("gN").value||0,st=document.getElementById("gStart").value,sh=document.getElementById("gShape").value;
      var kept=c4.installments.filter(function(i){return (+i.paidAmount>0)||i.boleta;});
      var keptPlanned=kept.reduce(function(s,i){return s+(+i.planned||0);},0);
      var remaining=Math.max(0,total-keptPlanned);
      var pl=generate(remaining,n,st,sh);
      if(pl.length||kept.length){c4.installments=kept.concat(pl);c4.plan=sh;c4.planBase=assignedMap()[c4.id]||0;render();}}return;}
    if(a==="regen-plan"){var cr=contrib();if(cr){var asg=assignedMap()[cr.id]||0;var n=cr.installments.length||6;var st=(cr.installments[0]&&cr.installments[0].date)||"2026-09-05";var sh=cr.plan||"cuota_fija";var pl=generate(asg,n,st,sh);cr.installments=pl;cr.planBase=asg;render();}return;}
    if(a==="keep-plan"){var ck=contrib();if(ck){ck.planBase=assignedMap()[ck.id]||0;save();render();}return;}
    if(a==="boleta"){attachBoleta(t.dataset.iid);return;}
    if(a==="view-boleta"){var c5=contrib();var ins=c5.installments.filter(function(x){return x.id===t.dataset.iid;})[0];if(ins&&ins.boleta)openModal('<h3 style="font-size:17px;margin-bottom:10px">Boleta · '+esc(ins.boleta.name)+'</h3><img src="'+ins.boleta.thumb+'" style="max-width:100%;border-radius:8px;border:1px solid var(--line)"><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px"><a class="btn" href="'+ins.boleta.thumb+'" download="'+esc(ins.boleta.name||"boleta.jpg")+'">⤓ Descargar</a><button class="btn" data-act="modal-close">Cerrar</button></div>');return;}
    if(a==="confirm-boleta"){confirmBoleta();return;}
    if(a==="modal-close"){closeModal();return;}
    if(a==="proposal"){attachProposal(t.dataset.id);return;}
    if(a==="view-proposal"){var rp=rubro(t.dataset.id);if(rp&&rp.proposal)openDataUrl(rp.proposal.url);return;}
    if(a==="remove-proposal"){var rr2=rubro(t.dataset.id);if(rr2){rr2.proposal=null;render();}return;}
    if(a==="add-vendor"){openModal(addVendorHTML(t.dataset.rid));return;}
    if(a==="save-vendor"){var rr0=rubro(t.dataset.rid);if(rr0){var nm=document.getElementById("nvName").value.trim()||"Proveedor";var cur=document.getElementById("nvCur").value;var amt=+document.getElementById("nvAmt").value||0;var note=document.getElementById("nvNote").value.trim();rr0.vendors.push({id:uid(),name:nm,currency:cur,amount:amt,fav:false,note:note,proposal:null});if(rr0.status==="por_definir")rr0.status="evaluacion";closeModal();render();}return;}
    if(a==="del-vendor"){var rr1=rubro(t.dataset.rid);if(rr1&&confirm("¿Eliminar este proveedor?")){rr1.vendors=rr1.vendors.filter(function(x){return x.id!==t.dataset.vid;});recomputeRubro(rr1);render();}return;}
    if(a==="ver-expediente"){var rid0=t.dataset.rid;if(!rid0){state.rubros.forEach(function(rr){if(vendorById(rr,t.dataset.vid))rid0=rr.id;});}openModal(vendorExpedienteHTML(rid0,t.dataset.vid));return;}
    if(a==="toggle-vendor"){var rr2=rubro(t.dataset.rid);var v2=rr2?vendorById(rr2,t.dataset.vid):null;if(rr2&&v2){v2.selected=!v2.selected;recomputeRubro(rr2);var inModal=document.getElementById("modal")&&document.getElementById("modal").style.display!=="none";if(inModal)closeModal();render();}return;}
    if(a==="fav-vendor"){var rr3=rubro(t.dataset.rid);var v3=rr3?vendorById(rr3,t.dataset.vid):null;if(v3){v3.fav=!v3.fav;render();}return;}
    if(a==="free-space"){var n=0;state.rubros.forEach(function(r){(r.vendors||[]).forEach(function(v){if(v.proposal&&v.proposal.url){v.proposal.url=null;v.proposal.stored=false;n++;}});});if(n){alert("Se liberó el espacio de "+n+" PDF. Se conservó el nombre de cada propuesta como referencia; el archivo ya no ocupa lugar en el navegador.");storageFull=false;save();render();}return;}
    if(a==="upload-vprop"){uploadVendorProposal(t.dataset.rid,t.dataset.vid);return;}
    if(a==="view-vprop"){var rr4=rubro(t.dataset.rid);var v4=rr4?vendorById(rr4,t.dataset.vid):null;if(v4&&v4.proposal)openDataUrl(v4.proposal.url);return;}
    if(a==="remove-vprop"){var rr5=rubro(t.dataset.rid);var v5=rr5?vendorById(rr5,t.dataset.vid):null;if(v5){v5.proposal=null;render();openModal(vendorExpedienteHTML(t.dataset.rid,t.dataset.vid));}return;}
    if(a==="cop"){document.getElementById("copAns").innerHTML=copAnswer(t.dataset.q);return;}
  });
  root.addEventListener("input",function(e){var t=e.target;var a=t.dataset.act;if(!a)return;
    if(a==="fx"){state.fx=+t.value||7.95;save();return;}
    if(a==="v-name"||a==="v-amt"||a==="v-note"){var rr=rubro(t.dataset.rid);var v=rr?vendorById(rr,t.dataset.vid):null;if(v){if(a==="v-name")v.name=t.value;else if(a==="v-amt")v.amount=+t.value||0;else v.note=t.value;recomputeRubro(rr);save();}return;}
    if(a==="techo"){var r=rubro(t.dataset.id);if(r){r.techo=+t.value||0;save();}return;}
    if(a==="rubro-name"){var rn=rubro(t.dataset.id);if(rn){rn.name=t.value;save();}return;}
    if(a==="pool-name"){var pn=state.pools.filter(function(x){return x.id===t.dataset.id;})[0];if(pn){pn.label=t.value;save();}return;}
    if(a==="guests"){var cg=state.contributors.filter(function(x){return x.id===t.dataset.id;})[0];if(cg){cg.guests=+t.value||0;save();}return;}
    if(a==="funder-pct"){var rp=rubro(t.dataset.id);var f=rp.split.funders.filter(function(x){return x.cid===t.dataset.cid;})[0];if(f){f.pct=+t.value||0;save();}return;}
    if(a==="funder-fixed"){var rx=rubro(t.dataset.id);var ff=rx.split.funders.filter(function(x){return x.cid===t.dataset.cid;})[0];if(ff){ff.fixed=+t.value||0;save();}return;}
    if(a==="dec-text"){var dc=state.decisions.filter(function(x){return x.id===t.dataset.id;})[0];if(dc){dc.text=t.value;save();}return;}
    if(a==="goal-amt"){state.pools.forEach(function(p){if(p.goals){var gg=p.goals.filter(function(x){return x.id===t.dataset.id;})[0];if(gg)gg.amount=+t.value||0;}});save();refreshAportesPeripherals();return;}
    if(a==="aporte-name"||a==="aporte-date"||a==="aporte-amt"){var ap=state.aportes.filter(function(x){return x.id===t.dataset.id;})[0];if(ap){if(a==="aporte-name")ap.name=t.value;else if(a==="aporte-date")ap.date=t.value;else ap.amount=+t.value||0;save();}return;}
    var c=contrib();if(!c)return;if(a==="c-name"){c.name=t.value;save();return;}if(a==="c-ceil"){c.ceiling=+t.value||0;save();return;}var tr=t.closest("tr");if(!tr)return;var ins=c.installments.filter(function(x){return x.id===tr.dataset.iid;})[0];if(!ins)return;if(a==="ins-date"){ins.date=t.value;save();refreshAportesPeripherals();}if(a==="ins-planned"){ins.planned=+t.value||0;save();refreshAportesPeripherals();}if(a==="ins-paidamt"){ins.paidAmount=+t.value||0;ins.paid=(+ins.paidAmount>0);save();refreshAportesPeripherals();}});
  root.addEventListener("change",function(e){var t=e.target;var a=t.dataset.act;if(!a)return;
    if(a==="fx"){state.rubros.forEach(function(r){recomputeRubro(r);});render();return;}
    if(a==="v-cur"){var rc=rubro(t.dataset.rid);var vc=rc?vendorById(rc,t.dataset.vid):null;if(vc){vc.currency=t.value;recomputeRubro(rc);render();openModal(vendorExpedienteHTML(t.dataset.rid,t.dataset.vid));}return;}
    if(a==="v-amt"){var ra=rubro(t.dataset.rid);if(ra)recomputeRubro(ra);render();openModal(vendorExpedienteHTML(t.dataset.rid,t.dataset.vid));return;}
    if(a==="pool"){var r=rubro(t.dataset.id);if(r){r.poolId=t.value;save();}return;}
    if(a==="ins-account"){var ca=contrib();if(ca){var tra=t.closest("tr");var insa=ca.installments.filter(function(x){return x.id===tra.dataset.iid;})[0];if(insa){insa.account=t.value||null;render();}}return;}
    if(a==="ins-filter"){insFilter=t.value;render();return;}
    if(a==="ins-paidamt"||a==="ins-planned"){render();return;}
    if(a==="split-base"){var rb=rubro(t.dataset.id);if(rb){rb.split.base=t.value;render();}return;}
    if(a==="chart-pool"){chartPool=t.value;render();return;}
    if(a==="dec-tag"){var dt=state.decisions.filter(function(x){return x.id===t.dataset.id;})[0];if(dt){dt.tag=t.value;save();}return;}
    if(a==="goal-date"){state.pools.forEach(function(p){if(p.goals){var gd=p.goals.filter(function(x){return x.id===t.dataset.id;})[0];if(gd)gd.date=t.value;}});render();return;}
    if(a==="funder-pct"||a==="funder-fixed"||a==="techo"||a==="c-ceil"||a==="guests"||a==="aporte-name"||a==="aporte-date"||a==="aporte-amt"||a==="aporte-pool"){if(a==="aporte-pool"){var ap2=state.aportes.filter(function(x){return x.id===t.dataset.id;})[0];if(ap2)ap2.poolId=t.value;}render();return;}
  });
  function rubro(id){return state.rubros.filter(function(x){return x.id===id;})[0];}
  function contrib(){return state.contributors.filter(function(x){return x.id===selContrib;})[0];}

  // ---------- ícono para "instalar" en el teléfono ----------
  (function(){try{var c=document.createElement("canvas");c.width=c.height=180;var x=c.getContext("2d");x.fillStyle="#0F6E56";x.fillRect(0,0,180,180);x.fillStyle="#fff";x.font="700 112px Georgia, serif";x.textAlign="center";x.textBaseline="middle";x.fillText("N",90,100);var icon=c.toDataURL("image/png");var l=document.createElement("link");l.rel="apple-touch-icon";l.href=icon;document.head.appendChild(l);var man={name:"Nuvia",short_name:"Nuvia",display:"standalone",background_color:"#F3F3EF",theme_color:"#0F6E56",icons:[{src:icon,sizes:"180x180",type:"image/png"}]};var mb=new Blob([JSON.stringify(man)],{type:"application/json"});var ml=document.createElement("link");ml.rel="manifest";ml.href=URL.createObjectURL(mb);document.head.appendChild(ml);}catch(e){}})();

  render();
})();
